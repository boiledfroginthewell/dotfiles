git:
  commit:
    autoWrapCommitMessage: false
  autoForwardBranches: none
  diffRenderers:
    - name: delta
      command: delta --paging=never
    - name: diffstatic
      type: extDiff
      command: difft --color=always --context={{diffContext}}
os:
  editPreset: "nvim-remote"
gui:
  tabWidth: 2
  spinner:
    frames: ["\U0001F311", "\U0001F312", "\U0001F313", "\U0001F314", "\U0001F315", "\U0001F316", "\U0001F317", "\U0001F318"]
    rate: 300
  nerdFontsVersion: "3"
keybinding:
  universal:
    executeShellCommand: "$"
