modmap:
  - name: Mouse
    device: &g520-hero
      only: Logitech G502 HERO Gaming Mouse Keyboard
    remap:
      # F21: RIGHTSHIFT
      F22: RIGHTCTRL

keymap:
  - name: Mouse
    device: *g520-hero
    remap:
      F21: SUPER-a

  - name: G520
    device:
      only: Logitech Gaming Mouse G502 Keyboard
    remap:
      Ctrl-Up: SUPER-a
